[package]
name = "splitview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A minimalistic, keyboard-driven terminal emulator with tmux-style split panes."

[[bin]]
name = "splitview"
path = "src/main.rs"

# Process liveness for the Claude usage meters (claude.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
sv-core.workspace = true
sv-term.workspace = true
eframe.workspace = true
egui.workspace = true
egui-phosphor.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
dirs.workspace = true
# Update checker (Windows) and the Claude usage limits (claude.rs).
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
portable-pty = "0.8"
notify = "8"
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }

# MCP server tokens (mcp.rs) and the update installer's checksum (update.rs).
rand = "0.8"
sha2 = "0.10"
# PowerShell -EncodedCommand (shell.rs).
base64 = "0.22"
