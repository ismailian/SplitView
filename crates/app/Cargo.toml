[package]
name = "splitview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A minimalistic, keyboard-driven terminal emulator with tmux-style split panes."

[[bin]]
name = "splitview"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
sv-core.workspace = true
sv-term.workspace = true
eframe.workspace = true
egui.workspace = true
egui-phosphor.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
dirs.workspace = true
portable-pty = "0.8"
notify = "8"
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }
qrcode = { version = "0.14", default-features = false }

# --- Remote control (docs/remote-control-desktop.md) ---
# Inert until the user enables it. `ring` is the rustls/rcgen provider: the default
# aws-lc-rs needs cmake + nasm.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "io-util", "macros"] }
tokio-tungstenite = "0.24"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
rand = "0.8"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
base64 = "0.22"
data-encoding = "2"
mdns-sd = "0.21"
bytes = "1"
futures-util = "0.3"
time = { version = "0.3", default-features = false, features = ["std"] }
