[package]
name = "splitview"
version = "0.1.0"
description = "A minimalistic, keyboard-driven terminal emulator"
authors = ["SplitView"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "splitview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `compression` is dropped from the default feature set: it pulls in brotli
# 8.0.3, which fails to compile on this toolchain. It only brotli-compresses the
# embedded frontend assets — without it they are embedded uncompressed, which is
# fine. The remaining features mirror tauri's defaults.
tauri = { version = "2", default-features = false, features = [
    "common-controls-v6",
    "dbus",
    "dynamic-acl",
    "wry",
    "webkit2gtk",
    "webview2-com",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
portable-pty = "0.8"
dirs = "5"
# Native file picker for the Win+O "insert file path" action. We drive its Rust
# API from our own `pick_file` command, so no extra capability is exposed to the
# frontend (CLAUDE.md §15).
tauri-plugin-dialog = "2"
# Filesystem change notifications for the file sidebar (ReadDirectoryChangesW /
# inotify / FSEvents). Watches only what the sidebar displays; see `watch.rs`.
notify = "8"

# --- Remote control (docs/remote-control-desktop.md) -------------------------
# The encrypted WebSocket server a paired phone connects to. All of this is
# inert until the user enables remote control in Settings.
#
# `ring` is pinned as the rustls/rcgen crypto provider: it builds with the
# toolchain already required for Tauri, unlike the default `aws-lc-rs` (cmake +
# nasm). Everything else is small and single-purpose.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "net",
    "time",
    "io-util",
    "macros",
] }
tokio-tungstenite = "0.24"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "ring",
    "tls12",
] }
rustls-pemfile = "2"
rcgen = "0.13"
rand = "0.8"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
base64 = "0.22"
data-encoding = "2"
mdns-sd = "0.21"
bytes = "1"
futures-util = "0.3"
# Certificate validity dates; no formatting feature, so no extra deps.
time = { version = "0.3", default-features = false, features = ["std"] }
